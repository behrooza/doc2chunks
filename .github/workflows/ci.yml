name: CI

on:
    pull_request:
    push:
        braches: [main]

jobs:
    test:
        runs-on: ubunto-latest
        steps:
            -uses: actions/checkout@v4
            -uses: actions/step-python@v5
            with:
                python-version: "3.12"
            -run: pip install -e ".[dev]"
            -run: ruff check .
            -run: mypy src
            -run: pytest